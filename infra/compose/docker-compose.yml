services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: sales_agent
      POSTGRES_USER: sales_agent
      POSTGRES_PASSWORD: sales_agent_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
        # PostgreSQL 18+ stores its versioned database directory under
        # /var/lib/postgresql, so we mount the parent directory.
        - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_agent -d sales_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.0
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
